name: PR Quality Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-gamemaker-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate .yyp resource references
        run: python3 tools/validate_project.py

      - name: Verify QA evidence for the reviewed game tree
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
          QA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/validate_qa.py "$QA_BASE" "$QA_HEAD"
